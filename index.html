<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free OBS Overlay Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.obs-overlay-mode { background-color: transparent !important; overflow: hidden; }
        .draggable-item { cursor: move; user-select: none; touch-action: none; position: absolute; will-change: transform, left, top; }
        .draggable-item:hover { outline: 2px dashed #6366f1; outline-offset: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <header id="main-header" class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold">
                <i class="fa-solid fa-tower-broadcast"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm uppercase text-white">Бесплатный Пульт Стримера</h1>
                <p class="text-[11px] text-slate-400">Управление без серверов и затрат</p>
            </div>
        </div>
        <button onclick="copyOverlayLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">
            <i class="fa-solid fa-link"></i> Скопировать ссылку для OBS
        </button>
    </header>

    <main class="flex-1 flex flex-col relative overflow-hidden p-6">
        <div id="view-operator" class="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1920px] mx-auto w-full">
            
            <div class="lg:col-span-8 flex flex-col gap-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300 mb-3">Предпросмотр сцены (Тяните элементы мышкой)</h2>
                    
                    <div id="preview-container" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 shadow-inner select-none">
                        <div id="preview-bg-holder" class="w-full h-full absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#312e81_1px,transparent_1px)] [background-size:16px_16px]"></div>
                        <div id="operator-overlay-canvas" class="absolute inset-0 z-20 overflow-hidden pointer-events-auto"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 flex flex-col gap-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                    <h2 class="font-bold text-xs uppercase text-slate-300">Добавить контент</h2>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Текст на экран</label>
                        <input type="text" id="text-input" placeholder="Привет стрим!" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                        <button onclick="addTextElement()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs cursor-pointer">Добавить текст</button>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Ссылка на видео (MP4 / WebM)</label>
                        <input type="url" id="video-url-input" placeholder="https://site.com/video.mp4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                        <button onclick="addVideoElement()" class="w-full mt-2 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl text-xs cursor-pointer">Добавить видео</button>
                    </div>

                    <button onclick="clearAll()" class="w-full bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 py-2 rounded-xl text-xs font-bold cursor-pointer mt-4">
                        Очистить всё
                    </button>
                </div>
            </div>

        </div>

        <div id="view-overlay" class="hidden absolute inset-0 w-full h-full pointer-events-none overflow-hidden">
            <div id="obs-render-canvas" class="relative w-full h-full"></div>
        </div>
    </main>

    <script>
        // Используем бесплатный публичный JSONbin / LocalStorage эмулятор или Firebase free tier
        const DB_KEY = "free_obs_overlay_state_v1";
        let activeOverlays = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        
        let isDragging = false;
        let dragTargetId = null;
        let dragStartX = 0, dragStartY = 0;
        let elementStartX = 0, elementStartY = 0;

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'overlay') {
                document.body.classList.add('obs-overlay-mode');
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('view-operator').classList.add('hidden');
                document.getElementById('view-overlay').classList.remove('hidden');
                setInterval(syncFromStorage, 500); // Синхронизация без серверов
            } else {
                setInterval(syncFromStorage, 1000);
            }
            renderScene();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        };

        function saveState() {
            localStorage.setItem(DB_KEY, JSON.stringify(activeOverlays));
            renderScene();
        }

        function syncFromStorage() {
            if (isDragging) return;
            const data = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            if (JSON.stringify(data) !== JSON.stringify(activeOverlays)) {
                activeOverlays = data;
                renderScene();
            }
        }

        function addTextElement() {
            const text = document.getElementById('text-input').value.trim();
            if (!text) return;
            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: 'text',
                content: text,
                x: 50, y: 50
            });
            saveState();
        }

        function addVideoElement() {
            const url = document.getElementById('video-url-input').value.trim();
            if (!url) return;
            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: 'video',
                url: url,
                x: 50, y: 50
            });
            saveState();
        }

        function clearAll() {
            activeOverlays = [];
            saveState();
        }

        function startDrag(e, id) {
            e.preventDefault();
            isDragging = true;
            dragTargetId = id;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            const item = activeOverlays.find(i => i.id === id);
            if (item) {
                elementStartX = item.x;
                elementStartY = item.y;
            }
        }

        function onMouseMove(e) {
            if (!isDragging || !dragTargetId) return;
            const container = document.getElementById('preview-container');
            if (!container) return;

            const rect = container.getBoundingClientRect();
            const deltaX = ((e.clientX - dragStartX) / rect.width) * 100;
            const deltaY = ((e.clientY - dragStartY) / rect.height) * 100;

            const item = activeOverlays.find(i => i.id === dragTargetId);
            if (item) {
                item.x = Math.max(5, Math.min(95, elementStartX + deltaX));
                item.y = Math.max(5, Math.min(95, elementStartY + deltaY));

                // Двигаем элемент плавно без пересоздания видео (!)
                const node = container.querySelector(`[data-id="${dragTargetId}"]`);
                if (node) {
                    node.style.left = item.x + '%';
                    node.style.top = item.y + '%';
                }
            }
        }

        function onMouseUp() {
            if (isDragging) {
                isDragging = false;
                dragTargetId = null;
                saveState(); // Сохраняем координаты в момент отпускания мыши
            }
        }

        function renderScene() {
            const operatorCanvas = document.getElementById('operator-overlay-canvas');
            const obsCanvas = document.getElementById('obs-render-canvas');

            if (operatorCanvas) operatorCanvas.innerHTML = '';
            if (obsCanvas) obsCanvas.innerHTML = '';

            activeOverlays.forEach(item => {
                if (operatorCanvas) operatorCanvas.appendChild(createDomNode(item, true));
                if (obsCanvas) obsCanvas.appendChild(createDomNode(item, false));
            });
        }

        function createDomNode(item, isInteractive) {
            const div = document.createElement('div');
            div.dataset.id = item.id;
            div.className = `absolute -translate-x-1/2 -translate-y-1/2 ${isInteractive ? 'draggable-item pointer-events-auto' : 'pointer-events-none'}`;
            div.style.left = item.x + '%';
            div.style.top = item.y + '%';

            if (isInteractive) {
                div.onmousedown = (e) => startDrag(e, item.id);
            }

            if (item.type === 'text') {
                div.innerHTML = `<div class="text-3xl font-black text-white drop-shadow-[0_4px_12px_rgba(0,0,0,0.9)] bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700">${escapeHtml(item.content)}</div>`;
            } else if (item.type === 'video') {
                // Видео создается один раз и не перезапускается при перемещении
                div.innerHTML = `<video src="${escapeHtml(item.url)}" autoplay loop muted playsinline class="w-[320px] rounded-xl shadow-2xl border border-slate-700"></video>`;
            }
            return div;
        }

        function copyOverlayLink() {
            const url = window.location.origin + window.location.pathname + '?mode=overlay';
            navigator.clipboard.writeText(url);
            alert('Ссылка скопирована!');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
