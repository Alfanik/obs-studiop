<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Overlay Studio Pro - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obs: {
                            dark: '#080c14',
                            card: '#111827',
                            panel: '#151d30',
                            border: '#243049',
                            accent: '#6366f1',
                            accentHover: '#4f46e5'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@700;900&family=Press+Start+2P&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">

    <style>
        body.obs-overlay-mode {
            background-color: transparent !important;
            overflow: hidden;
        }

        .text-outline-dark {
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 12px rgba(0,0,0,0.9);
        }
        .text-outline-glow {
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.9), 0 0 30px rgba(99, 102, 241, 0.5), -2px -2px 0 #000, 2px 2px 0 #000;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #080c14; }
        ::-webkit-scrollbar-thumb { background: #243049; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b4c6e; }

        .draggable-item {
            cursor: move;
            user-select: none;
            touch-action: none;
            position: absolute;
            will-change: transform, left, top;
            transition: transform 0.05s linear;
        }
        .draggable-item:hover {
            outline: 2px dashed #6366f1;
            outline-offset: 4px;
        }
    </style>
</head>
<body class="bg-obs-dark text-slate-100 font-sans min-h-screen antialiased flex flex-col selection:bg-indigo-600 selection:text-white">

    <header id="main-header" class="bg-obs-card/90 backdrop-blur border-b border-obs-border px-6 py-3.5 sticky top-0 z-50 flex items-center justify-between shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl font-black text-lg flex items-center justify-center w-10 h-10 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-tower-broadcast"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-sm tracking-wider uppercase text-white leading-tight">OBS LIVE OVERLAY STUDIO</h1>
                <p class="text-[11px] text-slate-400">Пульт Модератора & Облачный Оверлей</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden sm:flex items-center gap-2 bg-emerald-950/60 border border-emerald-500/40 px-3.5 py-1.5 rounded-full text-xs font-medium text-emerald-400">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Синхронизация активна</span>
            </div>

            <button onclick="copyOverlayLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition shadow-lg shadow-indigo-600/20 cursor-pointer">
                <i class="fa-solid fa-link"></i>
                <span>Ссылка OBS</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <div id="view-operator" class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-y-auto max-w-[1920px] mx-auto w-full">
            
            <div class="lg:col-span-7 flex flex-col gap-6">
                
                <div class="bg-obs-card border border-obs-border rounded-2xl p-4 shadow-xl flex flex-col">
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
                            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Пульт управления (Предпросмотр 16:9)</h2>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <select id="stream-provider" onchange="onStreamProviderChange()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1 text-slate-300 outline-none focus:border-indigo-500">
                                <option value="twitch">Twitch Embed</option>
                                <option value="screenshot">Скриншот игры / Фон</option>
                                <option value="testvideo">Тестовый поток</option>
                            </select>
                            <input type="text" id="twitch-channel-input" value="dell11q" onchange="onStreamProviderChange()" placeholder="Канал Twitch" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1 text-slate-200 w-28 outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div id="preview-container" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 shadow-inner group select-none">
                        <div id="preview-bg-holder" class="w-full h-full pointer-events-none">
                            <iframe id="twitch-frame" src="https://player.twitch.tv/?channel=dell11q&parent=localhost&muted=true" class="w-full h-full border-0 pointer-events-auto"></iframe>
                        </div>

                        <div id="operator-overlay-canvas" class="absolute inset-0 z-20 overflow-hidden pointer-events-auto"></div>

                        <div class="absolute top-3 right-3 z-30 flex items-center gap-2">
                            <label class="bg-slate-900/90 hover:bg-slate-800 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer backdrop-blur shadow flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-camera text-indigo-400"></i> Загрузить фон стрима
                                <input type="file" accept="image/*" class="hidden" onchange="uploadCustomBackground(event)">
                            </label>
                        </div>

                        <div class="absolute bottom-3 left-3 z-30 bg-slate-900/90 border border-slate-700/80 px-3 py-1 rounded-lg text-[11px] text-slate-300 backdrop-blur pointer-events-none flex items-center gap-1.5">
                            <i class="fa-solid fa-hand-pointer text-indigo-400"></i> Тяните мышкой • Колесико: масштаб
                        </div>
                    </div>
                </div>

                <div class="bg-obs-card border border-obs-border rounded-2xl p-4 shadow-xl flex-1 flex flex-col">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-indigo-400"></i>
                            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Активные элементы оверлея</h2>
                            <span id="active-count-badge" class="bg-indigo-900/60 border border-indigo-500/40 text-indigo-300 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                        </div>

                        <button onclick="clearAllOverlays()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-trash-can"></i> Очистить всё
                        </button>
                    </div>

                    <div id="active-elements-list" class="flex-1 min-h-[140px] max-h-[260px] overflow-y-auto space-y-2 pr-1">
                        <div id="empty-active-state" class="h-full flex flex-col items-center justify-center p-6 text-center text-slate-500 border border-dashed border-slate-700/60 rounded-xl">
                            <i class="fa-solid fa-ghost text-3xl mb-2 text-slate-600"></i>
                            <p class="text-xs">Экран пуст. Добавьте элемент справа.</p>
                        </div>
                    </div>
                </div>

            </div>

            <div class="lg:col-span-5 flex flex-col gap-6">
                
                <div class="bg-obs-card border border-obs-border rounded-2xl p-5 shadow-xl flex flex-col">
                    
                    <div class="flex border-b border-slate-700/80 mb-5 gap-2 overflow-x-auto pb-1">
                        <button id="tab-btn-text" onclick="switchControlTab('text')" class="px-3 py-2 text-xs font-bold border-b-2 border-indigo-500 text-white flex items-center gap-1.5 transition cursor-pointer">
                            <i class="fa-solid fa-font text-indigo-400"></i> Текст
                        </button>
                        <button id="tab-btn-image" onclick="switchControlTab('image')" class="px-3 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition cursor-pointer">
                            <i class="fa-solid fa-image text-emerald-400"></i> Картинка
                        </button>
                        <button id="tab-btn-video" onclick="switchControlTab('video')" class="px-3 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition cursor-pointer">
                            <i class="fa-solid fa-video text-purple-400"></i> Видео / YouTube
                        </button>
                    </div>

                    <!-- TAB 1: TEXT -->
                    <div id="tab-content-text" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Текст оверлея</label>
                            <textarea id="text-input" rows="3" placeholder="Введите текст..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 resize-none">ПРИВЕТ СТРИМ! 🔥</textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Размер</label>
                                <select id="text-size" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                                    <option value="text-2xl">Маленький</option>
                                    <option value="text-4xl" selected>Средний</option>
                                    <option value="text-6xl">Большой</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Цвет</label>
                                <input type="color" id="text-color" value="#ffffff" class="w-full h-8 rounded cursor-pointer bg-slate-900 border border-slate-700 px-1">
                            </div>
                        </div>

                        <button onclick="createNewTextOverlay()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm mt-4 cursor-pointer">
                            <i class="fa-solid fa-plus"></i> Создать текстовый блок
                        </button>
                    </div>

                    <!-- TAB 2: IMAGE -->
                    <div id="tab-content-image" class="space-y-4 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Прямая ссылка на картинку / GIF</label>
                            <input type="url" id="image-url-input" placeholder="https://site.com/image.png" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                        </div>
                        <button onclick="sendImageUrlOverlay()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                            <i class="fa-solid fa-image"></i> Вывести изображение
                        </button>
                    </div>

                    <!-- TAB 3: VIDEO / YOUTUBE -->
                    <div id="tab-content-video" class="space-y-4 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Ссылка на видео (MP4 / WebM / YouTube)</label>
                            <input type="url" id="video-url-input" placeholder="https://www.youtube.com/watch?v=... или .mp4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Громкость (%)</label>
                            <input type="range" id="video-volume" min="0" max="100" value="80" class="w-full accent-purple-500">
                        </div>
                        <button onclick="sendVideoUrlOverlay()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                            <i class="fa-solid fa-video"></i> Вывести видео / YouTube
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <div id="view-overlay" class="hidden absolute inset-0 w-full h-full pointer-events-none overflow-hidden">
            <div id="obs-render-canvas" class="relative w-full h-full"></div>
        </div>

    </main>

    <script>
        const FIREBASE_DB_URL = "https://alfanik-ac5d7-default-rtdb.firebaseio.com/obs_state.json";

        let activeOverlays = [];
        let lastCloudString = "";
        let isDragging = false;
        let dragTargetId = null;
        let dragStartX = 0, dragStartY = 0;
        let elementStartX = 0, elementStartY = 0;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const modeParam = urlParams.get('mode');

            if (modeParam === 'overlay') {
                switchView('overlay');
                loadLocalCacheDirect();
                setInterval(fetchStateFromCloud, 800);
                fetchStateFromCloud();
            } else {
                switchView('operator');
                setInterval(() => {
                    if (!isDragging) fetchStateFromCloud();
                }, 1500);
                fetchStateFromCloud();
            }

            window.addEventListener('mousemove', handleGlobalMouseMove);
            window.addEventListener('mouseup', handleGlobalMouseUp);
            window.addEventListener('touchmove', handleGlobalTouchMove, { passive: false });
            window.addEventListener('touchend', handleGlobalMouseUp);
        };

        function saveAndBroadcast() {
            const cleanOverlays = activeOverlays.map(item => ({
                id: item.id,
                type: item.type,
                content: item.content,
                url: item.url,
                size: item.size,
                color: item.color,
                scale: item.scale || 1,
                x: item.x,
                y: item.y,
                volume: item.volume || 0.8
            }));

            const jsonString = JSON.stringify(cleanOverlays);
            lastCloudString = jsonString;
            localStorage.setItem('obs_cache_v5', jsonString);
            
            fetch(FIREBASE_DB_URL, {
                method: 'PUT',
                body: jsonString,
                headers: { 'Content-Type': 'application/json' }
            }).catch(err => console.error(err));
        }

        function loadLocalCacheDirect() {
            try {
                const cached = localStorage.getItem('obs_cache_v5');
                if (cached) {
                    activeOverlays = JSON.parse(cached);
                    reconcileScene();
                }
            } catch(e) {}
        }

        function fetchStateFromCloud() {
            if (isDragging) return;

            fetch(FIREBASE_DB_URL, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    let newData = [];
                    if (data && Array.isArray(data)) newData = data;
                    else if (data && typeof data === 'object') newData = Object.values(data);

                    const newString = JSON.stringify(newData);
                    if (newString !== lastCloudString) {
                        lastCloudString = newString;
                        localStorage.setItem('obs_cache_v5', newString);
                        activeOverlays = newData;
                        reconcileScene();
                    }
                })
                .catch(err => loadLocalCacheDirect());
        }

        function switchView(mode) {
            const header = document.getElementById('main-header');
            const viewOp = document.getElementById('view-operator');
            const viewOv = document.getElementById('view-overlay');

            if (mode === 'overlay') {
                document.body.classList.add('obs-overlay-mode');
                header.classList.add('hidden');
                viewOp.classList.add('hidden');
                viewOv.classList.remove('hidden');
            } else {
                document.body.classList.remove('obs-overlay-mode');
                header.classList.remove('hidden');
                viewOp.classList.remove('hidden');
                viewOv.classList.add('hidden');
            }
        }

        function createNewTextOverlay() {
            const textVal = document.getElementById('text-input').value.trim() || 'Текст';
            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: 'text',
                content: textVal,
                size: document.getElementById('text-size').value,
                color: document.getElementById('text-color').value,
                scale: 1,
                x: 50,
                y: 50
            });
            saveAndBroadcast();
            reconcileScene();
        }

        function sendImageUrlOverlay() {
            const url = document.getElementById('image-url-input').value.trim();
            if (!url) return;
            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: 'image',
                url: url,
                scale: 1,
                x: 50,
                y: 50
            });
            document.getElementById('image-url-input').value = '';
            saveAndBroadcast();
            reconcileScene();
        }

        function sendVideoUrlOverlay() {
            const rawUrl = document.getElementById('video-url-input').value.trim();
            if (!rawUrl) return;
            const vol = (parseInt(document.getElementById('video-volume').value) || 80) / 100;
            
            // Умное определение YouTube
            let finalUrl = rawUrl;
            let type = 'video';
            
            if (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be')) {
                type = 'youtube';
                let videoId = '';
                if (rawUrl.includes('youtu.be/')) {
                    videoId = rawUrl.split('youtu.be/')[1].split('?')[0];
                } else if (rawUrl.includes('v=')) {
                    videoId = rawUrl.split('v=')[1].split('&')[0];
                }
                // Формируем правильную ссылку на плеер YouTube с автозапуском и звуком
                finalUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0`;
            }

            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: type,
                url: finalUrl,
                scale: 1,
                x: 50,
                y: 50,
                volume: vol
            });
            document.getElementById('video-url-input').value = '';
            saveAndBroadcast();
            reconcileScene();
        }

        function clearAllOverlays() {
            activeOverlays = [];
            saveAndBroadcast();
            reconcileScene();
        }

        function reconcileScene() {
            updateCanvasContainer('operator-overlay-canvas', true);
            updateCanvasContainer('obs-render-canvas', false);
            updateActiveList();
        }

        function updateCanvasContainer(containerId, isInteractive) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const existingNodes = container.querySelectorAll('[data-id]');
            const existingMap = new Map();
            existingNodes.forEach(node => existingMap.set(node.dataset.id, node));

            const activeIds = new Set(activeOverlays.map(i => i.id));

            existingMap.forEach((node, id) => {
                if (!activeIds.has(id)) node.remove();
            });

            activeOverlays.forEach(item => {
                let node = existingMap.get(item.id);

                if (!node) {
                    node = document.createElement('div');
                    node.dataset.id = item.id;
                    node.className = `absolute -translate-x-1/2 -translate-y-1/2 ${isInteractive ? 'draggable-item pointer-events-auto' : 'pointer-events-none'}`;
                    
                    if (isInteractive) {
                        node.onmousedown = (e) => startDrag(e, item.id);
                        node.ontouchstart = (e) => startDrag(e, item.id);
                        node.onwheel = (e) => handleWheelScale(e, item.id);
                    }

                    if (item.type === 'text') {
                        node.innerHTML = `<div class="${item.size} font-black text-center text-outline-dark text-content" style="color: ${item.color};">${escapeHtml(item.content)}</div>`;
                    } else if (item.type === 'image') {
                        node.innerHTML = `<img src="${escapeHtml(item.url)}" class="max-w-[400px] rounded-xl shadow-2xl">`;
                    } else if (item.type === 'video') {
                        // ВАЖНО: В пульте управления (isInteractive = true) видео ВСЕГДА MUTE, чтобы звук не двоился!
                        // В OBS (isInteractive = false) звук играет с заданной громкостью.
                        const muteAttr = isInteractive ? 'muted' : '';
                        node.innerHTML = `<video src="${escapeHtml(item.url)}" autoplay loop ${muteAttr} playsinline class="max-w-[450px] rounded-xl shadow-2xl"></video>`;
                        const vid = node.querySelector('video');
                        if (vid && !isInteractive) vid.volume = item.volume || 0.8;
                    } else if (item.type === 'youtube') {
                        // YouTube плеер через iframe
                        node.innerHTML = `<iframe src="${escapeHtml(item.url)}" class="w-[480px] aspect-video rounded-xl shadow-2xl border-0 pointer-events-auto" allow="autoplay"></iframe>`;
                    }
                    container.appendChild(node);
                }

                updateNodeTransform(item.id, item.x, item.y, item.scale || 1);
            });
        }

        function startDrag(e, id) {
            e.preventDefault();
            isDragging = true;
            dragTargetId = id;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;

            const item = activeOverlays.find(i => i.id === id);
            if (item) {
                elementStartX = item.x;
                elementStartY = item.y;
            }
        }

        function handleGlobalMouseMove(e) {
            if (!isDragging || !dragTargetId) return;
            const container = document.getElementById('preview-container');
            if (!container) return;

            const rect = container.getBoundingClientRect();
            const deltaX = ((e.clientX - dragStartX) / rect.width) * 100;
            const deltaY = ((e.clientY - dragStartY) / rect.height) * 100;

            const item = activeOverlays.find(i => i.id === dragTargetId);
            if (item) {
                item.x = Math.max(5, Math.min(95, elementStartX + deltaX));
                item.y = Math.max(5, Math.min(95, elementStartY + deltaY));

                updateNodeTransform(item.id, item.x, item.y, item.scale || 1);
            }
        }

        function handleGlobalTouchMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            handleGlobalMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        }

        function handleGlobalMouseUp() {
            if (isDragging) {
                isDragging = false;
                dragTargetId = null;
                saveAndBroadcast();
            }
        }

        function handleWheelScale(e, id) {
            e.preventDefault();
            const item = activeOverlays.find(i => i.id === id);
            if (!item) return;

            if (!item.scale) item.scale = 1;
            if (e.deltaY < 0) {
                item.scale = Math.min(item.scale + 0.1, 3);
            } else {
                item.scale = Math.max(item.scale - 0.1, 0.3);
            }

            updateNodeTransform(item.id, item.x, item.y, item.scale);
            saveAndBroadcast();
        }

        function updateNodeTransform(id, x, y, scale) {
            const nodes = document.querySelectorAll(`[data-id="${id}"]`);
            nodes.forEach(node => {
                node.style.left = x + '%';
                node.style.top = y + '%';
                node.style.transform = `translate3d(-50%, -50%, 0) scale(${scale})`;
            });
        }

        function updateActiveList() {
            const list = document.getElementById('active-elements-list');
            const badge = document.getElementById('active-count-badge');
            if (!list || !badge) return;

            badge.innerText = activeOverlays.length;
            if (activeOverlays.length === 0) {
                list.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center p-6 text-center text-slate-500 border border-dashed border-slate-700/60 rounded-xl">
                        <i class="fa-solid fa-ghost text-3xl mb-2 text-slate-600"></i>
                        <p class="text-xs">Экран пуст. Добавьте элемент справа.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = activeOverlays.map(item => `
                <div class="bg-slate-900 border border-slate-700 p-2.5 rounded-xl flex items-center justify-between text-xs">
                    <div class="truncate mr-2">
                        <span class="font-bold text-indigo-400 uppercase">[${item.type}]</span> 
                        <span class="text-slate-200">${escapeHtml(item.content || item.url)}</span>
                    </div>
                    <button onclick="removeOverlayItem('${item.id}')" class="text-slate-400 hover:text-red-400 p-1 cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        function removeOverlayItem(id) {
            activeOverlays = activeOverlays.filter(i => i.id !== id);
            saveAndBroadcast();
            reconcileScene();
        }

        function onStreamProviderChange() {
            const provider = document.getElementById('stream-provider').value;
            const channelName = document.getElementById('twitch-channel-input').value.trim() || 'dell11q';
            const bgHolder = document.getElementById('preview-bg-holder');

            if (provider === 'twitch') {
                const host = window.location.hostname || 'localhost';
                bgHolder.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${channelName}&parent=${host}&muted=true" class="w-full h-full border-0 pointer-events-auto"></iframe>`;
            } else if (provider === 'screenshot') {
                bgHolder.innerHTML = `<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1280&q=80" class="w-full h-full object-cover opacity-60">`;
            } else if (provider === 'testvideo') {
                bgHolder.innerHTML = `<video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" autoplay loop muted class="w-full h-full object-cover opacity-50"></video>`;
            }
        }

        function uploadCustomBackground(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('stream-provider').value = 'screenshot';
                document.getElementById('preview-bg-holder').innerHTML = `<img src="${evt.target.result}" class="w-full h-full object-cover">`;
            };
            reader.readAsDataURL(file);
        }

        function switchControlTab(tab) {
            ['text', 'image', 'video'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tab) {
                    btn.classList.add('border-indigo-500', 'text-white');
                    btn.classList.remove('border-transparent', 'text-slate-400');
                    content.classList.remove('hidden');
                } else {
                    btn.classList.remove('border-indigo-500', 'text-white');
                    btn.classList.add('border-transparent', 'text-slate-400');
                    content.classList.add('hidden');
                }
            });
        }

        function copyOverlayLink() {
            const url = window.location.origin + window.location.pathname + '?mode=overlay';
            navigator.clipboard.writeText(url);
            alert('Ссылка для OBS успешно скопирована!');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
