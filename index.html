<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Overlay Studio - Instant Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.obs-overlay-mode { background-color: transparent !important; overflow: hidden; }
        .draggable-item { cursor: move; user-select: none; touch-action: none; position: absolute; will-change: transform, left, top; }
        .draggable-item:hover { outline: 2px dashed #6366f1; outline-offset: 4px; }
        .text-outline-dark { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 12px rgba(0,0,0,0.9); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <header id="main-header" class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between sticky top-0 z-50 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold">
                <i class="fa-solid fa-tower-broadcast"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm uppercase text-white">Пульт Стримера (Мгновенный движок 60 FPS)</h1>
                <p class="text-[11px] text-slate-400">Без задержек и перезагрузок видео</p>
            </div>
        </div>
        <button onclick="copyOverlayLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer shadow-lg">
            <i class="fa-solid fa-link"></i> Скопировать ссылку для OBS
        </button>
    </header>

    <main class="flex-1 flex flex-col relative overflow-hidden p-6">
        <div id="view-operator" class="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1920px] mx-auto w-full">
            
            <div class="lg:col-span-8 flex flex-col gap-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300 mb-3">Предпросмотр (Тяните мышкой, колесико — масштаб)</h2>
                    
                    <div id="preview-container" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 shadow-inner select-none">
                        <div id="preview-bg-holder" class="w-full h-full absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#312e81_1px,transparent_1px)] [background-size:16px_16px]"></div>
                        <div id="operator-overlay-canvas" class="absolute inset-0 z-20 overflow-hidden pointer-events-auto"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 flex flex-col gap-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                    <h2 class="font-bold text-xs uppercase text-slate-300">Управление контентом</h2>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Текст на экран</label>
                        <input type="text" id="text-input" placeholder="Привет стрим!" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                        <button onclick="addTextElement()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer">Добавить текст</button>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Прямая ссылка на видео (MP4 / WebM)</label>
                        <input type="url" id="video-url-input" placeholder="https://site.com/video.mp4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                        <button onclick="addVideoElement()" class="w-full mt-2 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer">Добавить видео</button>
                    </div>

                    <button onclick="clearAll()" class="w-full bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 py-2.5 rounded-xl text-xs font-bold cursor-pointer mt-4">
                        Очистить всё
                    </button>
                </div>
            </div>

        </div>

        <div id="view-overlay" class="hidden absolute inset-0 w-full h-full pointer-events-none overflow-hidden">
            <div id="obs-render-canvas" class="relative w-full h-full"></div>
        </div>
    </main>

    <script>
        const channel = new BroadcastChannel('obs_instant_sync_channel');
        let activeOverlays = [];
        
        let isDragging = false;
        let dragTargetId = null;
        let dragStartX = 0, dragStartY = 0;
        let elementStartX = 0, elementStartY = 0;

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const isOverlay = params.get('mode') === 'overlay';

            if (isOverlay) {
                document.body.classList.add('obs-overlay-mode');
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('view-operator').classList.add('hidden');
                document.getElementById('view-overlay').classList.remove('hidden');
            }

            // Слушаем мгновенные сообщения между пультом и оверлеем
            channel.onmessage = function(event) {
                if (event.data.type === 'STATE_UPDATE') {
                    activeOverlays = event.data.state;
                    reconcileScene();
                }
            };

            // Запрашиваем состояние при старте
            channel.postMessage({ type: 'REQUEST_SYNC' });

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onMouseUp);
        };

        // Отправка состояния всем вкладкам (включая OBS) мгновенно
        function broadcastState() {
            channel.postMessage({ type: 'STATE_UPDATE', state: activeOverlays });
            reconcileScene();
        }

        function addTextElement() {
            const text = document.getElementById('text-input').value.trim();
            if (!text) return;
            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: 'text',
                content: text,
                scale: 1,
                x: 50, y: 50
            });
            broadcastState();
        }

        function addVideoElement() {
            const url = document.getElementById('video-url-input').value.trim();
            if (!url) return;
            activeOverlays.push({
                id: 'el_' + Date.now(),
                type: 'video',
                url: url,
                scale: 1,
                x: 50, y: 50
            });
            broadcastState();
        }

        function clearAll() {
            activeOverlays = [];
            broadcastState();
        }

        function startDrag(e, id) {
            e.preventDefault();
            isDragging = true;
            dragTargetId = id;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;

            const item = activeOverlays.find(i => i.id === id);
            if (item) {
                elementStartX = item.x;
                elementStartY = item.y;
            }
        }

        function onMouseMove(e) {
            if (!isDragging || !dragTargetId) return;
            const container = document.getElementById('preview-container');
            if (!container) return;

            const rect = container.getBoundingClientRect();
            const deltaX = ((e.clientX - dragStartX) / rect.width) * 100;
            const deltaY = ((e.clientY - dragStartY) / rect.height) * 100;

            const item = activeOverlays.find(i => i.id === dragTargetId);
            if (item) {
                item.x = Math.max(5, Math.min(95, elementStartX + deltaX));
                item.y = Math.max(5, Math.min(95, elementStartY + deltaY));

                // Прямое обновление стилей БЕЗ пересоздания узлов и видео (идеальная плавность!)
                updateNodeTransform(item.id, item.x, item.y, item.scale || 1);
            }
        }

        function onTouchMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        }

        function onMouseUp() {
            if (isDragging) {
                isDragging = false;
                dragTargetId = null;
                broadcastState(); // Фиксируем координаты при отпускании
            }
        }

        function handleWheelScale(e, id) {
            e.preventDefault();
            const item = activeOverlays.find(i => i.id === id);
            if (!item) return;

            if (!item.scale) item.scale = 1;
            if (e.deltaY < 0) {
                item.scale = Math.min(item.scale + 0.1, 3);
            } else {
                item.scale = Math.max(item.scale - 0.1, 0.3);
            }

            updateNodeTransform(item.id, item.x, item.y, item.scale);
            broadcastState();
        }

        function updateNodeTransform(id, x, y, scale) {
            const nodes = document.querySelectorAll(`[data-id="${id}"]`);
            nodes.forEach(node => {
                node.style.left = x + '%';
                node.style.top = y + '%';
                node.style.transform = `translate(-50%, -50%) scale(${scale})`;
            });
        }

        // Умный рендер: создает элементы только один раз, видео никогда не перезапускается!
        function reconcileScene() {
            updateContainer('operator-overlay-canvas', true);
            updateContainer('obs-render-canvas', false);
        }

        function updateContainer(containerId, isInteractive) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const existingNodes = container.querySelectorAll('[data-id]');
            const existingMap = new Map();
            existingNodes.forEach(node => existingMap.set(node.dataset.id, node));

            const activeIds = new Set(activeOverlays.map(i => i.id));

            existingMap.forEach((node, id) => {
                if (!activeIds.has(id)) node.remove();
            });

            activeOverlays.forEach(item => {
                let node = existingMap.get(item.id);

                if (!node) {
                    node = document.createElement('div');
                    node.dataset.id = item.id;
                    node.className = `absolute -translate-x-1/2 -translate-y-1/2 ${isInteractive ? 'draggable-item pointer-events-auto' : 'pointer-events-none'}`;
                    
                    if (isInteractive) {
                        node.onmousedown = (e) => startDrag(e, item.id);
                        node.ontouchstart = (e) => startDrag(e, item.id);
                        node.onwheel = (e) => handleWheelScale(e, item.id);
                    }

                    if (item.type === 'text') {
                        node.innerHTML = `<div class="text-4xl font-black text-center text-outline-dark bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 text-white">${escapeHtml(item.content)}</div>`;
                    } else if (item.type === 'video') {
                        // ВИДЕО СОЗДАЕТСЯ РОВНО 1 РАЗ И ИГРАЕТ НЕПРЕРЫВНО
                        node.innerHTML = `<video src="${escapeHtml(item.url)}" autoplay loop muted playsinline class="w-[360px] rounded-xl shadow-2xl border border-slate-700"></video>`;
                    }
                    container.appendChild(node);
                }

                updateNodeTransform(item.id, item.x, item.y, item.scale || 1);
            });
        }

        function copyOverlayLink() {
            const url = window.location.origin + window.location.pathname + '?mode=overlay';
            navigator.clipboard.writeText(url);
            alert('Ссылка OBS скопирована!');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
