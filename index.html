<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Overlay Studio (Full)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        .anim-fade { animation: fadeIn 0.3s ease-out forwards; }
        .anim-zoom { animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-slide { animation: slideDown 0.3s ease-out forwards; }
        .anim-none { opacity: 1 !important; transform: none !important; }

        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- РЕЖИМ ОВЕРЛЕЯ ДЛЯ OBS -->
    <div id="obs-overlay-view" class="hidden fixed inset-0 overflow-hidden pointer-events-none z-50">
        <div id="active-elements-container" class="relative w-full h-full"></div>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div id="control-panel-view" class="flex flex-col min-h-screen">
        <header class="bg-gray-900/90 backdrop-blur border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wider text-white uppercase">OBS Live Overlay Studio</h1>
                    <p class="text-[11px] text-gray-400">Пульт Модератора</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="hidden sm:flex items-center space-x-2 bg-emerald-950/40 border border-emerald-500/30 px-3 py-1.5 rounded-full">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="text-[11px] font-medium text-emerald-300">Облако подключено</span>
                </div>
                <button onclick="copyOverlayLink()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/20 cursor-pointer flex items-center space-x-2">
                    <span>🔗 Ссылка OBS</span>
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 grid grid-cols-1 xl:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
            <div class="xl:col-span-2 flex flex-col space-y-4">
                <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-4 flex flex-col shadow-xl">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs uppercase font-semibold text-gray-400 tracking-wider flex items-center space-x-2">
                            <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                            <span>Предпросмотр экрана (16:9)</span>
                        </span>
                        <div class="flex items-center space-x-2">
                            <select id="preview-source-type" onchange="updateTwitchPreview()" class="bg-gray-800 border border-gray-700 text-xs rounded-lg px-2.5 py-1.5 text-gray-300 focus:outline-none">
                                <option value="twitch">Twitch Embed</option>
                                <option value="test">Тестовый фон</option>
                            </select>
                            <input type="text" id="twitch-channel-input" placeholder="Канал" value="dell11q" onchange="updateTwitchPreview()" class="bg-gray-800 border border-gray-700 text-xs rounded-lg px-2.5 py-1.5 text-gray-200 w-24">
                        </div>
                    </div>

                    <div id="preview-canvas" class="relative w-full aspect-video bg-black/90 rounded-xl overflow-hidden border border-gray-800 shadow-inner select-none flex items-center justify-center">
                        <div id="preview-stream-bg" class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
                            <div id="twitch-embed-container" class="w-full h-full"></div>
                        </div>
                        <div id="preview-elements-layer" class="absolute inset-0 z-10 pointer-events-none"></div>
                        
                        <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur px-2.5 py-1 rounded text-[10px] text-gray-400 z-20 pointer-events-none">
                            💡 Перетаскивайте элементы мышкой на превью для изменения позиции
                        </div>
                    </div>
                </div>

                <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-4 flex flex-col shadow-xl">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-semibold text-gray-300">Активные элементы на экране</h3>
                        <button onclick="clearAllOverlays()" class="text-xs text-red-400 hover:text-red-300 transition cursor-pointer">Очистить всё</button>
                    </div>
                    <div id="active-elements-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                        <span class="text-xs text-gray-500 italic">Нет активных элементов</span>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-5 shadow-xl flex flex-col space-y-4">
                    <div class="flex border-b border-gray-800 pb-3 space-x-1 overflow-x-auto">
                        <button onclick="switchTab('text')" id="tab-btn-text" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Текст</button>
                        <button onclick="switchTab('widgets')" id="tab-btn-widgets" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition">Виджеты</button>
                        <button onclick="switchTab('image')" id="tab-btn-image" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition">Картинка</button>
                        <button onclick="switchTab('video')" id="tab-btn-video" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition">Видео</button>
                    </div>

                    <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl p-3 space-y-2">
                        <label class="block text-[11px] font-medium text-gray-300">Анимация появления:</label>
                        <select id="global-animation" class="w-full bg-gray-800 border border-gray-700 text-xs rounded-lg px-2.5 py-1.5 text-gray-200">
                            <option value="none">Без анимации</option>
                            <option value="fade">Плавное появление (Fade)</option>
                            <option value="zoom">Увеличение (Zoom)</option>
                            <option value="slide">Вылет сверху (Slide)</option>
                        </select>
                    </div>

                    <!-- Панель ТЕКСТ -->
                    <div id="tab-content-text" class="space-y-3">
                        <label class="block text-xs font-medium text-gray-400">Текст сообщения</label>
                        <textarea id="text-input" oninput="liveUpdateText()" rows="3" placeholder="Введите текст..." class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-gray-100 focus:outline-none focus:border-indigo-500"></textarea>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] text-gray-400 mb-1">Размер шрифта</label>
                                <input type="number" id="text-size" value="36" onchange="liveUpdateText()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-gray-200">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-400 mb-1">Шрифт</label>
                                <select id="text-font" onchange="liveUpdateText()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-gray-200">
                                    <option value="system-ui">Стандартный</option>
                                    <option value="Impact">Impact (Мемы)</option>
                                    <option value="Courier New">Monospace</option>
                                    <option value="Georgia">Georgia</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] text-gray-400 mb-1">Цвет текста</label>
                                <input type="color" id="text-color" value="#ffffff" onchange="liveUpdateText()" class="w-full h-8 bg-gray-800 border border-gray-700 rounded-lg cursor-pointer px-1">
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-400 mb-1">Цвет фона</label>
                                <input type="color" id="text-bg-color" value="#000000" onchange="liveUpdateText()" class="w-full h-8 bg-gray-800 border border-gray-700 rounded-lg cursor-pointer px-1">
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-400 mb-1">Прозрачность</label>
                                <input type="range" id="text-bg-opacity" min="0" max="1" step="0.1" value="0.5" oninput="liveUpdateText()" class="w-full accent-indigo-500 mt-2">
                            </div>
                        </div>

                        <button onclick="createNewElement('text')" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-xs font-semibold transition mt-2 cursor-pointer">Создать новый блок текста</button>
                    </div>

                    <!-- Панель ВИДЖЕТЫ -->
                    <div id="tab-content-widgets" class="space-y-3 hidden">
                        <label class="block text-xs font-medium text-gray-400 mb-2">Готовые плашки для стрима</label>
                        <button onclick="sendWidget('telegram')" class="w-full flex items-center justify-between bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 p-3 rounded-xl text-xs font-semibold text-white transition shadow-lg cursor-pointer">
                            <span class="flex items-center space-x-2"><span class="text-base">✈️</span><span>Telegram: t.me/Dell11q</span></span>
                            <span class="bg-black/30 px-2 py-1 rounded text-[10px]">Вывести</span>
                        </button>
                        <button onclick="sendWidget('follow')" class="w-full flex items-center justify-between bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-500 hover:to-indigo-600 p-3 rounded-xl text-xs font-semibold text-white transition shadow-lg cursor-pointer">
                            <span class="flex items-center space-x-2"><span class="text-base">💜</span><span>Напоминание: Прожми Фоллоу!</span></span>
                            <span class="bg-black/30 px-2 py-1 rounded text-[10px]">Вывести</span>
                        </button>
                        <button onclick="sendWidget('donate')" class="w-full flex items-center justify-between bg-gradient-to-r from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 p-3 rounded-xl text-xs font-semibold text-white transition shadow-lg cursor-pointer">
                            <span class="flex items-center space-x-2"><span class="text-base">💰</span><span>Поддержать (Донат)</span></span>
                            <span class="bg-black/30 px-2 py-1 rounded text-[10px]">Вывести</span>
                        </button>
                    </div>

                    <!-- Панель КАРТИНКА -->
                    <div id="tab-content-image" class="space-y-3 hidden">
                        <label class="block text-xs font-medium text-gray-400">Загрузить с компьютера</label>
                        <input type="file" id="image-file-input" accept="image/*" onchange="uploadFileAsBase64('image')" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2 text-xs text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                        
                        <div class="relative flex py-2 items-center">
                            <div class="flex-grow border-t border-gray-700"></div>
                            <span class="flex-shrink mx-4 text-[10px] text-gray-500 uppercase">или по ссылке</span>
                            <div class="flex-grow border-t border-gray-700"></div>
                        </div>

                        <input type="text" id="image-url-input" placeholder="https://site.com/image.png" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-gray-200">
                        <button onclick="sendMediaElement('image')" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-xs font-semibold transition mt-2 cursor-pointer">Отправить картинку</button>
                    </div>

                    <!-- Панель ВИДЕО -->
                    <div id="tab-content-video" class="space-y-3 hidden">
                        <label class="block text-xs font-medium text-gray-400">Загрузить видео MP4 / WebM</label>
                        <input type="file" id="video-file-input" accept="video/mp4,video/webm" onchange="uploadFileAsBase64('video')" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2 text-xs text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                        
                        <div class="relative flex py-2 items-center">
                            <div class="flex-grow border-t border-gray-700"></div>
                            <span class="flex-shrink mx-4 text-[10px] text-gray-500 uppercase">или по ссылке</span>
                            <div class="flex-grow border-t border-gray-700"></div>
                        </div>

                        <input type="text" id="video-url-input" placeholder="https://site.com/video.mp4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-gray-200">
                        <button onclick="sendMediaElement('video')" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-xs font-semibold transition mt-2 cursor-pointer">Отправить видео</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://alfanik-ac5d7-default-rtdb.firebaseio.com/obs_state.json";
        const isOverlayMode = new URLSearchParams(window.location.search).has('mode');
        let elementsState = {};
        let activeLiveTextId = null;

        if (isOverlayMode) {
            document.getElementById('obs-overlay-view').classList.remove('hidden');
            document.getElementById('control-panel-view').remove();
            setInterval(pollCloudForOBS, 1000);
            pollCloudForOBS();
        } else {
            initControlPanel();
            setInterval(fetchStateFromCloud, 1500);
            fetchStateFromCloud();
        }

        function saveAndBroadcast() {
            fetch(FIREBASE_DB_URL, {
                method: 'PUT',
                body: JSON.stringify(elementsState),
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                if (!isOverlayMode) {
                    updatePreviewCanvas();
                    updateActiveList();
                }
            }).catch(err => console.error("Ошибка сохранения:", err));
        }

        function fetchStateFromCloud() {
            if (isOverlayMode) return;
            fetch(FIREBASE_DB_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data === 'object') {
                        elementsState = data;
                    } else {
                        elementsState = {};
                    }
                    updatePreviewCanvas();
                    updateActiveList();
                })
                .catch(err => console.error("Ошибка загрузки:", err));
        }

        function pollCloudForOBS() {
            fetch(FIREBASE_DB_URL, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data === 'object') {
                        renderOverlayElements(data);
                    }
                })
                .catch(() => {});
        }

        function renderOverlayElements(state) {
            const container = document.getElementById('active-elements-container');
            if (!container) return;
            container.innerHTML = '';
            
            Object.values(state).forEach(el => {
                if (!el || el.hidden) return;

                const div = document.createElement('div');
                const animClass = el.anim === 'fade' ? 'anim-fade' : el.anim === 'zoom' ? 'anim-zoom' : el.anim === 'slide' ? 'anim-slide' : 'anim-none';
                div.className = `absolute transform -translate-x-1/2 -translate-y-1/2 ${animClass}`;
                div.style.left = el.x + '%';
                div.style.top = el.y + '%';

                if (el.type === 'text') {
                    let rgbaBg = hexToRgba(el.bgColor || '#000000', el.bgOpacity !== undefined ? el.bgOpacity : 0.5);
                    div.innerHTML = `<div style="font-size: ${el.size}px; font-family: ${el.font || 'system-ui'}; color: ${el.color}; background: ${rgbaBg}; padding: 6px 12px; border-radius: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); font-weight: bold; white-space: pre-wrap;">${escapeHtml(el.content)}</div>`;
                } else if (el.type === 'image') {
                    div.innerHTML = `<img src="${el.url}" style="max-width: 400px; height: auto;" />`;
                } else if (el.type === 'video') {
                    div.innerHTML = `<video src="${el.url}" autoplay loop style="max-width: 500px;"></video>`;
                } else if (el.type === 'widget') {
                    div.innerHTML = el.html;
                }
                container.appendChild(div);
            });
        }

        function initControlPanel() {
            updateTwitchPreview();
            setupDragAndDropOnPreview();
        }

        function switchTab(tab) {
            ['text', 'image', 'video', 'widgets'].forEach(t => {
                const el = document.getElementById(`tab-content-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (el) el.classList.add('hidden');
                if (btn) btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 text-gray-400 hover:text-white transition';
            });
            const activeEl = document.getElementById(`tab-content-${tab}`);
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeEl) activeEl.classList.remove('hidden');
            if (activeBtn) activeBtn.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition';
        }

        function updateTwitchPreview() {
            const type = document.getElementById('preview-source-type').value;
            const container = document.getElementById('twitch-embed-container');
            const channelName = document.getElementById('twitch-channel-input').value.trim() || 'dell11q';
            
            if (type === 'twitch') {
                const parentDomain = window.location.hostname || 'localhost';
                container.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${channelName}&parent=${parentDomain}&muted=true" height="100%" width="100%" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>`;
            } else {
                container.innerHTML = `<div class="w-full h-full bg-gradient-to-br from-indigo-900 via-purple-900 to-gray-900 flex items-center justify-center text-gray-400 text-sm">Тестовый фон потока</div>`;
            }
        }

        function liveUpdateText() {
            const content = document.getElementById('text-input').value;
            const size = document.getElementById('text-size').value;
            const font = document.getElementById('text-font').value;
            const color = document.getElementById('text-color').value;
            const bgColor = document.getElementById('text-bg-color').value;
            const bgOpacity = document.getElementById('text-bg-opacity').value;
            const anim = document.getElementById('global-animation').value;

            if (!activeLiveTextId || !elementsState[activeLiveTextId]) {
                activeLiveTextId = 'text_' + Date.now();
                elementsState[activeLiveTextId] = { id: activeLiveTextId, type: 'text', content, size, font, color, bgColor, bgOpacity, anim, x: 50, y: 50, hidden: false };
            } else {
                elementsState[activeLiveTextId].content = content;
                elementsState[activeLiveTextId].size = size;
                elementsState[activeLiveTextId].font = font;
                elementsState[activeLiveTextId].color = color;
                elementsState[activeLiveTextId].bgColor = bgColor;
                elementsState[activeLiveTextId].bgOpacity = bgOpacity;
                elementsState[activeLiveTextId].anim = anim;
            }
            saveAndBroadcast();
        }

        function createNewElement(type) {
            activeLiveTextId = null;
            document.getElementById('text-input').value = '';
            saveAndBroadcast();
        }

        function uploadFileAsBase64(type) {
            const fileInput = document.getElementById(`${type}-file-input`);
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const anim = document.getElementById('global-animation').value;
                    addElementToState({ type, url: e.target.result, anim, hidden: false });
                    fileInput.value = '';
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function sendMediaElement(type) {
            const urlInput = document.getElementById(`${type}-url-input`);
            const anim = document.getElementById('global-animation').value;
            if (urlInput.value.trim() !== '') {
                addElementToState({ type, url: urlInput.value.trim(), anim, hidden: false });
                urlInput.value = '';
            }
        }

        function sendWidget(kind) {
            const anim = document.getElementById('global-animation').value;
            let html = '';
            if (kind === 'telegram') {
                html = `<div style="background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 2px solid rgba(56, 189, 248, 0.6); padding: 12px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px;"><span style="font-size: 28px;">✈️</span><div><div style="font-size: 11px; text-transform: uppercase; color: #38bdf8; font-weight: bold;">Telegram канал</div><div style="font-size: 20px; color: #ffffff; font-weight: bold;">t.me/Dell11q</div></div></div>`;
            } else if (kind === 'follow') {
                html = `<div style="background: rgba(49, 10, 101, 0.9); backdrop-filter: blur(10px); border: 2px solid rgba(168, 85, 247, 0.6); padding: 12px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px;"><span style="font-size: 28px;">💜</span><div><div style="font-size: 11px; text-transform: uppercase; color: #c084fc; font-weight: bold;">Поддержи стримера</div><div style="font-size: 20px; color: #ffffff; font-weight: bold;">Прожми фоллоу!</div></div></div>`;
            } else if (kind === 'donate') {
                html = `<div style="background: rgba(120, 53, 15, 0.9); backdrop-filter: blur(10px); border: 2px solid rgba(251, 146, 60, 0.6); padding: 12px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px;"><span style="font-size: 28px;">💰</span><div><div style="font-size: 11px; text-transform: uppercase; color: #fb923c; font-weight: bold;">Поддержать рублём</div><div style="font-size: 20px; color: #ffffff; font-weight: bold;">Ссылка в описании</div></div></div>`;
            }
            addElementToState({ type: 'widget', html, anim, hidden: false });
        }

        function addElementToState(data) {
            const id = data.type + '_' + Date.now();
            elementsState[id] = { id, x: 50, y: 50, ...data };
            saveAndBroadcast();
        }

        function updatePreviewCanvas() {
            const layer = document.getElementById('preview-elements-layer');
            if (!layer) return;
            layer.innerHTML = '';

            Object.values(elementsState).forEach(el => {
                if (!el) return;
                const div = document.createElement('div');
                div.className = `absolute transform -translate-x-1/2 -translate-y-1/2 cursor-move border ${el.hidden ? 'border-dashed border-red-500/50 opacity-40' : 'border-indigo-500/40 hover:border-indigo-400'} p-1 rounded bg-black/40 backdrop-blur pointer-events-auto transition-opacity`;
                div.style.left = el.x + '%';
                div.style.top = el.y + '%';
                div.dataset.id = el.id;

                if (el.type === 'text') {
                    div.innerHTML = `<span style="font-size: ${Math.max(12, el.size/2.5)}px; color: ${el.color}; font-weight: bold;">${escapeHtml(el.content || '')}</span>`;
                } else if (el.type === 'image') {
                    div.innerHTML = `<img src="${el.url}" class="max-h-20 pointer-events-none" />`;
                } else if (el.type === 'video') {
                    div.innerHTML = `<video src="${el.url}" class="max-h-20 pointer-events-none" autoplay muted></video>`;
                } else if (el.type === 'widget') {
                    div.innerHTML = `<div class="scale-50 origin-center pointer-events-none">${el.html}</div>`;
                }
                layer.appendChild(div);
            });
        }

        function updateActiveList() {
            const list = document.getElementById('active-elements-list');
            if (!list) return;
            list.innerHTML = '';
            
            const keys = Object.keys(elementsState);
            if (keys.length === 0) {
                list.innerHTML = '<span class="text-xs text-gray-500 italic">Нет активных элементов</span>';
                return;
            }

            keys.forEach(id => {
                const el = elementsState[id];
                if (!el) return;
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-gray-800/80 px-3 py-2 rounded-xl text-xs';
                row.innerHTML = `
                    <span class="truncate max-w-[180px] text-gray-300 ${el.hidden ? 'line-through text-gray-500' : ''}">${el.type.toUpperCase()}: ${el.title || el.content || 'Медиа'}</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="toggleVisibility('${id}')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-gray-200 transition cursor-pointer">${el.hidden ? '👁️‍🗨️ Скрыт' : '👁️ Глаз'}</button>
                        <button onclick="removeElement('${id}')" class="text-red-400 hover:text-red-300 cursor-pointer">Удалить</button>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function toggleVisibility(id) {
            if (elementsState[id]) {
                elementsState[id].hidden = !elementsState[id].hidden;
                saveAndBroadcast();
            }
        }

        function removeElement(id) {
            if (id === activeLiveTextId) activeLiveTextId = null;
            delete elementsState[id];
            saveAndBroadcast();
        }

        function clearAllOverlays() {
            elementsState = {};
            activeLiveTextId = null;
            saveAndBroadcast();
        }

        function copyOverlayLink() {
            const url = window.location.origin + window.location.pathname + '?mode=overlay';
            navigator.clipboard.writeText(url);
            alert('Ссылка для OBS скопирована!');
        }

        function escapeHtml(text) {
            return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function hexToRgba(hex, alpha) {
            let c = hex.replace('#','');
            if(c.length===3) c = c.split('').map(x => x + x).join('');
            let num = parseInt(c, 16);
            return `rgba(${(num>>16)&255}, ${(num>>8)&255}, ${num&255}, ${alpha})`;
        }

        // Исправление лагов и телепортации: координаты обновляются плавно локально, а в облако улетают только при отпускании мыши!
        function setupDragAndDropOnPreview() {
            const canvas = document.getElementById('preview-canvas');
            let draggedId = null;

            canvas.addEventListener('mousedown', (e) => {
                const target = e.target.closest('[data-id]');
                if (target) {
                    draggedId = target.dataset.id;
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!draggedId || !elementsState[draggedId]) return;
                const rect = canvas.getBoundingClientRect();
                let x = ((e.clientX - rect.left) / rect.width) * 100;
                let y = ((e.clientY - rect.top) / rect.height) * 100;
                
                elementsState[draggedId].x = Math.max(0, Math.min(100, x));
                elementsState[draggedId].y = Math.max(0, Math.min(100, y));
                
                // Плавное перемещение без дерганий на превью
                const elDiv = canvas.querySelector(`[data-id="${draggedId}"]`);
                if (elDiv) {
                    elDiv.style.left = elementsState[draggedId].x + '%';
                    elDiv.style.top = elementsState[draggedId].y + '%';
                }
            });

            window.addEventListener('mouseup', () => {
                if (draggedId) {
                    draggedId = null;
                    saveAndBroadcast(); // Отправка в облако только после завершения перетаскивания
                }
            });
        }
    </script>
</body>
</html>
