<style>
    :root {
        --obs-dark: #080c14;
        --obs-card: #111827;
        --obs-panel: #151d30;
        --obs-border: #243049;
        --obs-accent: #6366f1;
        --obs-accent-hover: #4f46e5;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--obs-dark);
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    body.obs-overlay-mode {
        background-color: transparent !important;
        overflow: hidden;
    }

    header {
        background: rgba(17, 24, 39, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--obs-border);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    .header-logo {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo-icon {
        background: var(--obs-accent);
        color: white;
        padding: 8px;
        border-radius: 12px;
        font-size: 18px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    .logo-title {
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .logo-sub {
        font-size: 11px;
        color: #94a3b8;
    }

    .btn {
        background: var(--obs-accent);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
        background: var(--obs-accent-hover);
    }

    .btn-danger {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
        background: rgba(239, 68, 68, 0.4);
    }

    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }

    .operator-grid {
        flex: 1;
        padding: 24px;
        display: grid;
        grid-template-columns: 7fr 5fr;
        gap: 24px;
        max-width: 1920px;
        margin: 0 auto;
        width: 100%;
        overflow-y: auto;
    }

    @media (max-width: 1024px) {
        .operator-grid {
            grid-template-columns: 1fr;
        }
    }

    .card {
        background: var(--obs-card);
        border: 1px solid var(--obs-border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
    }

    .preview-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: black;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #1e293b;
        user-select: none;
    }

    .preview-bg-holder {
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .preview-bg-holder iframe, .preview-bg-holder video, .preview-bg-holder img {
        width: 100%;
        height: 100%;
        border: none;
        object-fit: cover;
    }

    #operator-overlay-canvas, #obs-render-canvas {
        position: absolute;
        inset: 0;
        overflow: hidden;
    }

    .draggable-item {
        cursor: move;
        user-select: none;
        touch-action: none;
        position: absolute;
        will-change: transform, left, top;
        /* ОТКЛЮЧАЕМ любые CSS-переходы для плавного перемещения без задержек */
        transition: none !important;
    }

    .draggable-item:hover {
        outline: 2px dashed var(--obs-accent);
        outline-offset: 4px;
    }

    .tabs-header {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--obs-border);
        margin-bottom: 20px;
        padding-bottom: 4px;
        overflow-x: auto;
    }

    .tab-btn {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: #94a3b8;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
    }

    .tab-btn.active {
        color: white;
        border-color: var(--obs-accent);
    }

    .form-group {
        margin-bottom: 16px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 6px;
    }

    input[type="text"], input[type="url"], input[type="number"], select, textarea {
        width: 100%;
        background: #0f172a;
        border: 1px solid var(--obs-border);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: white;
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
        border-color: var(--obs-accent);
    }

    textarea {
        resize: none;
    }

    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .text-outline-dark {
        text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 12px rgba(0,0,0,0.9);
    }
    .text-outline-glow {
        text-shadow: 0 0 15px rgba(99, 102, 241, 0.9), 0 0 30px rgba(99, 102, 241, 0.5), -2px -2px 0 #000, 2px 2px 0 #000;
    }

    .active-list {
        flex: 1;
        min-h: 140px;
        max-height: 250px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 4px;
    }

    .active-item-row {
        background: #0f172a;
        border: 1px solid var(--obs-border);
        padding: 10px 12px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
    }

    .toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
    }

    .toast {
        background: var(--obs-accent);
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }
</style>


<header id="main-header">
    <div class="header-logo">
        <div class="logo-icon">
            <i class="fa-solid fa-tower-broadcast"></i>
        </div>
        <div>
            <h1 class="logo-title">OBS LIVE OVERLAY STUDIO</h1>
            <p class="logo-sub">Профессиональный пульт модератора</p>
        </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #34d399;">
            <span style="width: 8px; height: 8px; background: #34d399; border-radius: 50%; animation: pulse 1.5s infinite;"></span>
            <span>Синхронизация активна</span>
        </div>
        <button onclick="copyOverlayLink()" class="btn">
            <i class="fa-solid fa-link"></i> Ссылка OBS
        </button>
    </div>
</header>

<main>
    <div id="view-operator" class="operator-grid">
        <div style="display: flex; flex-direction: column; gap: 24px;">
            
            <div class="card">
                <div style="display: flex; align-items: center; justify-between; margin-bottom: 12px;">
                    <h2 style="font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: 700;">Предпросмотр холста (16:9)</h2>
                    <div style="display: flex; gap: 8px;">
                        <select id="stream-provider" onchange="onStreamProviderChange()" style="width: auto; padding: 4px 8px; font-size: 11px;">
                            <option value="twitch">Twitch Stream</option>
                            <option value="screenshot">Фон / Скриншот</option>
                            <option value="testvideo">Тест видео</option>
                        </select>
                        <input type="text" id="twitch-channel-input" value="dell11q" onchange="onStreamProviderChange()" style="width: 100px; padding: 4px 8px; font-size: 11px;" placeholder="Канал">
                    </div>
                </div>

                <div id="preview-container" class="preview-container">
                    <div id="preview-bg-holder" class="preview-bg-holder">
                        <iframe id="twitch-frame" src="https://player.twitch.tv/?channel=dell11q&parent=localhost&muted=true" style="width:100%;height:100%;border:0;"></iframe>
                    </div>
                    <div id="operator-overlay-canvas" style="position: absolute; inset: 0; z-index: 20;"></div>
                </div>
            </div>

            <div class="card" style="flex: 1;">
                <div style="display: flex; align-items: center; justify-between; margin-bottom: 12px;">
                    <h2 style="font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: 700;">Активные элементы</h2>
                    <button onclick="clearAllOverlays()" class="btn btn-danger" style="padding: 4px 10px; font-size: 11px;">
                        <i class="fa-solid fa-trash-can"></i> Очистить всё
                    </button>
                </div>
                <div id="active-elements-list" class="active-list">
                    <div style="text-align: center; color: #64748b; padding: 40px; font-size: 12px;">Экран пуст. Добавьте элемент справа.</div>
                </div>
            </div>

        </div>

        <div style="display: flex; flex-direction: column; gap: 24px;">
            <div class="card">
                <div class="tabs-header">
                    <button id="tab-btn-text" onclick="switchControlTab('text')" class="tab-btn active"><i class="fa-solid fa-font"></i> Текст</button>
                    <button id="tab-btn-image" onclick="switchControlTab('image')" class="tab-btn"><i class="fa-solid fa-image"></i> Картинка</button>
                    <button id="tab-btn-video" onclick="switchControlTab('video')" class="tab-btn"><i class="fa-solid fa-video"></i> Видео / YouTube</button>
                </div>

                <!-- TAB TEXT -->
                <div id="tab-content-text">
                    <div class="form-group">
                        <label>Текст оверлея (Живой ввод)</label>
                        <textarea id="text-input" rows="3" oninput="onLiveTextTyping()">ПРИВЕТ СТРИМ! 🔥</textarea>
                    </div>
                    <div class="grid-2 form-group">
                        <div>
                            <label>Размер</label>
                            <select id="text-size" onchange="onLiveTextStyleChange()">
                                <option value="text-2xl">Маленький</option>
                                <option value="text-4xl" selected>Средний</option>
                                <option value="text-6xl">Большой</option>
                            </select>
                        </div>
                        <div>
                            <label>Цвет текста</label>
                            <input type="color" id="text-color" value="#ffffff" onchange="onLiveTextStyleChange()" style="height: 38px; padding: 2px; cursor: pointer;">
                        </div>
                    </div>
                    <button onclick="createNewTextOverlay()" class="btn" style="width: 100%; justify-content: center; margin-top: 10px;">
                        <i class="fa-solid fa-plus"></i> Создать новый текстовый блок
                    </button>
                </div>

                <!-- TAB IMAGE -->
                <div id="tab-content-image" class="hidden">
                    <div class="form-group">
                        <label>Прямая ссылка на картинку / GIF</label>
                        <input type="url" id="image-url-input" placeholder="https://site.com/image.png">
                    </div>
                    <button onclick="sendImageUrlOverlay()" class="btn" style="width: 100%; justify-content: center; background: #059669;">
                        <i class="fa-solid fa-image"></i> Вывести изображение
                    </button>
                </div>

                <!-- TAB VIDEO -->
                <div id="tab-content-video" class="hidden">
                    <div class="form-group">
                        <label>Ссылка на видео (.mp4 / .webm / YouTube)</label>
                        <input type="url" id="video-url-input" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="form-group">
                        <label>Громкость звука (%)</label>
                        <input type="range" id="video-volume" min="0" max="100" value="80" style="width: 100%;">
                    </div>
                    <button onclick="sendVideoUrlOverlay()" class="btn" style="width: 100%; justify-content: center; background: #7c3aed;">
                        <i class="fa-solid fa-video"></i> Вывести видео / YouTube
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-overlay" class="hidden" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;">
        <div id="obs-render-canvas" style="position: relative; width: 100%; height: 100%;"></div>
    </div>
</main>

<div id="toast-container" class="toast-container"></div>

<script>
    const FIREBASE_DB_URL = "https://alfanik-ac5d7-default-rtdb.firebaseio.com/obs_state.json";
    const bc = new BroadcastChannel('obs_studio_sync_v8');

    let activeOverlays = [];
    let liveTextId = null;
    let lastCloudString = "";

    let isDragging = false;
    let dragTargetId = null;
    let dragStartX = 0, dragStartY = 0;
    let elemStartX = 0, elemStartY = 0;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'overlay') {
            switchView('overlay');
            loadLocalCache();
            setInterval(fetchStateFromCloud, 800);
        } else {
            switchView('operator');
            ensureLiveText();
            loadLocalCache();
            setInterval(() => {
                if (!isDragging) fetchStateFromCloud();
            }, 1500);
        }

        bc.onmessage = (e) => {
            if (e.data.type === 'SYNC' && !isDragging) {
                activeOverlays = e.data.state;
                reconcileScene();
            }
        };

        window.addEventListener('mousemove', handleGlobalMouseMove);
        window.addEventListener('mouseup', handleGlobalMouseUp);
        window.addEventListener('touchmove', handleGlobalTouchMove, { passive: false });
        window.addEventListener('touchend', handleGlobalMouseUp);
    };

    function switchView(mode) {
        if (mode === 'overlay') {
            document.body.classList.add('obs-overlay-mode');
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('view-operator').classList.add('hidden');
            document.getElementById('view-overlay').classList.remove('hidden');
        } else {
            document.body.classList.remove('obs-overlay-mode');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('view-operator').classList.remove('hidden');
            document.getElementById('view-overlay').classList.add('hidden');
        }
    }

    function saveAndBroadcast() {
        const jsonString = JSON.stringify(activeOverlays);
        lastCloudString = jsonString;
        localStorage.setItem('obs_cache_v8', jsonString);
        bc.postMessage({ type: 'SYNC', state: activeOverlays });

        fetch(FIREBASE_DB_URL, {
            method: 'PUT',
            body: jsonString,
            headers: { 'Content-Type': 'application/json' }
        }).catch(err => console.error(err));

        reconcileScene();
    }

    function loadLocalCache() {
        try {
            const cached = localStorage.getItem('obs_cache_v8');
            if (cached) {
                activeOverlays = JSON.parse(cached);
                reconcileScene();
            }
        } catch(e) {}
    }

    function fetchStateFromCloud() {
        if (isDragging) return;
        fetch(FIREBASE_DB_URL, { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                let newData = [];
                if (data && Array.isArray(data)) newData = data;
                else if (data && typeof data === 'object') newData = Object.values(data);

                const str = JSON.stringify(newData);
                if (str !== lastCloudString && newData.length > 0) {
                    lastCloudString = str;
                    localStorage.setItem('obs_cache_v8', str);
                    activeOverlays = newData;
                    reconcileScene();
                }
            })
            .catch(e => {});
    }

    function ensureLiveText() {
        if (!liveTextId || !activeOverlays.find(i => i.id === liveTextId)) {
            const textVal = document.getElementById('text-input').value;
            const item = {
                id: 'livetext_' + Date.now(),
                type: 'text',
                content: textVal,
                size: 'text-4xl',
                color: '#ffffff',
                scale: 1,
                x: 50,
                y: 50
            };
            liveTextId = item.id;
            activeOverlays.push(item);
            saveAndBroadcast();
        }
    }

    function onLiveTextTyping() {
        ensureLiveText();
        const val = document.getElementById('text-input').value;
        const item = activeOverlays.find(i => i.id === liveTextId);
        if (item) {
            item.content = val;
            const nodes = document.querySelectorAll(`[data-id="${item.id}"] .text-content`);
            nodes.forEach(n => n.innerText = val);
            saveAndBroadcast();
        }
    }

    function onLiveTextStyleChange() {
        ensureLiveText();
        const item = activeOverlays.find(i => i.id === liveTextId);
        if (item) {
            item.size = document.getElementById('text-size').value;
            item.color = document.getElementById('text-color').value;
            saveAndBroadcast();
        }
    }

    function createNewTextOverlay() {
        const val = document.getElementById('text-input').value || 'Текст';
        activeOverlays.push({
            id: 'el_' + Date.now(),
            type: 'text',
            content: val,
            size: document.getElementById('text-size').value,
            color: document.getElementById('text-color').value,
            scale: 1,
            x: 50,
            y: 40 + Math.random() * 20
        });
        saveAndBroadcast();
        showToast('Текстовый блок создан');
    }

    function sendImageUrlOverlay() {
        const url = document.getElementById('image-url-input').value.trim();
        if (!url) return showToast('Укажите URL картинки');
        activeOverlays.push({
            id: 'el_' + Date.now(),
            type: 'image',
            url: url,
            scale: 1,
            x: 50,
            y: 50
        });
        document.getElementById('image-url-input').value = '';
        saveAndBroadcast();
        showToast('Картинка добавлена');
    }

    function sendVideoUrlOverlay() {
        const rawUrl = document.getElementById('video-url-input').value.trim();
        if (!rawUrl) return showToast('Укажите URL видео');
        const vol = (parseInt(document.getElementById('video-volume').value) || 80) / 100;
        
        let finalUrl = rawUrl;
        let type = 'video';
        if (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be')) {
            type = 'youtube';
            let id = rawUrl.includes('youtu.be/') ? rawUrl.split('youtu.be/')[1].split('?')[0] : rawUrl.split('v=')[1].split('&')[0];
            finalUrl = `https://www.youtube.com/embed/${id}?autoplay=1&mute=0&controls=0`;
        }

        activeOverlays.push({
            id: 'el_' + Date.now(),
            type: type,
            url: finalUrl,
            scale: 1,
            x: 50,
            y: 50,
            volume: vol
        });
        document.getElementById('video-url-input').value = '';
        saveAndBroadcast();
        showToast('Видео добавлено');
    }

    function clearAllOverlays() {
        activeOverlays = [];
        liveTextId = null;
        saveAndBroadcast();
        showToast('Всё очищено');
    }

    function reconcileScene() {
        renderCanvasContainer('operator-overlay-canvas', true);
        renderCanvasContainer('obs-render-canvas', false);
        renderActiveList();
    }

    function renderCanvasContainer(containerId, isInteractive) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const existingNodes = container.querySelectorAll('[data-id]');
        const existingMap = new Map();
        existingNodes.forEach(node => existingMap.set(node.dataset.id, node));

        const activeIds = new Set(activeOverlays.map(i => i.id));
        existingMap.forEach((node, id) => {
            if (!activeIds.has(id)) node.remove();
        });

        activeOverlays.forEach(item => {
            let node = existingMap.get(item.id);

            if (!node) {
                node = document.createElement('div');
                node.dataset.id = item.id;
                node.className = `absolute -translate-x-1/2 -translate-y-1/2 ${isInteractive ? 'draggable-item pointer-events-auto' : 'pointer-events-none'}`;
                
                if (isInteractive) {
                    node.onmousedown = (e) => startDrag(e, item.id);
                    node.ontouchstart = (e) => startDrag(e, item.id);
                    node.onwheel = (e) => handleWheelScale(e, item.id);
                }

                if (item.type === 'text') {
                    node.innerHTML = `<div class="${item.size} font-black text-center text-outline-dark text-content cursor-pointer" style="color: ${item.color};">${escapeHtml(item.content)}</div>`;
                    if (isInteractive) {
                        const textDiv = node.querySelector('.text-content');
                        textDiv.ondblclick = (e) => {
                            e.stopPropagation();
                            enableTextInlineEdit(item.id, textDiv);
                        };
                    }
                } else if (item.type === 'image') {
                    node.innerHTML = `<img src="${escapeHtml(item.url)}" class="max-w-[400px] rounded-xl shadow-2xl">`;
                } else if (item.type === 'video') {
                    const muteAttr = isInteractive ? 'muted' : '';
                    node.innerHTML = `<video src="${escapeHtml(item.url)}" autoplay loop ${muteAttr} playsinline class="max-w-[450px] rounded-xl shadow-2xl"></video>`;
                    const vid = node.querySelector('video');
                    if (vid && !isInteractive) vid.volume = item.volume || 0.8;
                } else if (item.type === 'youtube') {
                    node.innerHTML = `<iframe src="${escapeHtml(item.url)}" class="w-[480px] aspect-video rounded-xl shadow-2xl border-0 pointer-events-auto" allow="autoplay"></iframe>`;
                }
                container.appendChild(node);
            }

            updateNodeTransform(item.id, item.x, item.y, item.scale || 1);
        });
    }

    // --- УЛЬТРАПЛАВНОЕ ПЕРЕМЕЩЕНИЕ БЕЗ ТЕЛЕПОРТАЦИИ ---
    function startDrag(e, id) {
        e.preventDefault();
        isDragging = true;
        dragTargetId = id;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        dragStartX = clientX;
        dragStartY = clientY;

        const item = activeOverlays.find(i => i.id === id);
        if (item) {
            elemStartX = item.x;
            elemStartY = item.y;
        }
    }

    function handleGlobalMouseMove(e) {
        if (!isDragging || !dragTargetId) return;
        const container = document.getElementById('preview-container');
        if (!container) return;

        const rect = container.getBoundingClientRect();
        const deltaX = ((e.clientX - dragStartX) / rect.width) * 100;
        const deltaY = ((e.clientY - dragStartY) / rect.height) * 100;

        const item = activeOverlays.find(i => i.id === dragTargetId);
        if (item) {
            item.x = Math.max(5, Math.min(95, elemStartX + deltaX));
            item.y = Math.max(5, Math.min(95, elemStartY + deltaY));

            const nodes = document.querySelectorAll(`[data-id="${dragTargetId}"]`);
            nodes.forEach(node => {
                node.style.left = item.x + '%';
                node.style.top = item.y + '%';
            });
        }
    }

    function handleGlobalTouchMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.touches[0];
        handleGlobalMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
    }

    function handleGlobalMouseUp() {
        if (isDragging) {
            isDragging = false;
            dragTargetId = null;
            saveAndBroadcast();
        }
    }

    function handleWheelScale(e, id) {
        e.preventDefault();
        const item = activeOverlays.find(i => i.id === id);
        if (!item) return;

        item.scale = Math.max(0.3, Math.min(3, (item.scale || 1) + (e.deltaY < 0 ? 0.1 : -0.1)));
        updateNodeTransform(item.id, item.x, item.y, item.scale);
        saveAndBroadcast();
    }

    function updateNodeTransform(id, x, y, scale) {
        const nodes = document.querySelectorAll(`[data-id="${id}"]`);
        nodes.forEach(node => {
            node.style.left = x + '%';
            node.style.top = y + '%';
            node.style.transform = `translate3d(-50%, -50%, 0) scale(${scale})`;
        });
    }

    function enableTextInlineEdit(id, textContainer) {
        const item = activeOverlays.find(i => i.id === id);
        if (!item) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.value = item.content;
        input.className = "bg-slate-900 border-2 border-indigo-500 text-white px-3 py-1 rounded-xl text-center outline-none font-bold w-full";

        textContainer.innerHTML = '';
        textContainer.appendChild(input);
        input.focus();
        input.select();

        const save = () => {
            if (input.value.trim()) {
                item.content = input.value.trim();
                saveAndBroadcast();
            } else {
                reconcileScene();
            }
        };
        input.onblur = save;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') save();
            if (e.key === 'Escape') reconcileScene();
        };
    }

    function renderActiveList() {
        const list = document.getElementById('active-elements-list');
        if (!list) return;

        if (activeOverlays.length === 0) {
            list.innerHTML = `<div style="text-align: center; color: #64748b; padding: 40px; font-size: 12px;">Экран пуст. Добавьте элемент справа.</div>`;
            return;
        }

        list.innerHTML = activeOverlays.map(item => `
            <div class="active-item-row">
                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;">
                    <span style="color: #818cf8; font-weight: bold; text-transform: uppercase;">[${item.type}]</span> 
                    <span>${escapeHtml(item.content || item.url)}</span>
                </div>
                <button onclick="removeOverlayItem('${item.id}')" class="btn btn-danger" style="padding: 2px 8px; font-size: 10px;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        `).join('');
    }

    function removeOverlayItem(id) {
        activeOverlays = activeOverlays.filter(i => i.id !== id);
        saveAndBroadcast();
    }

    function onStreamProviderChange() {
        const val = document.getElementById('stream-provider').value;
        const chan = document.getElementById('twitch-channel-input').value.trim() || 'dell11q';
        const holder = document.getElementById('preview-bg-holder');

        if (val === 'twitch') {
            holder.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${chan}&parent=${window.location.hostname || 'localhost'}&muted=true" style="width:100%;height:100%;border:0;"></iframe>`;
        } else if (val === 'screenshot') {
            holder.innerHTML = `<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1280&q=80" style="width:100%;height:100%;object-fit:cover;opacity:0.6;">`;
        } else {
            holder.innerHTML = `<video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" autoplay loop muted style="width:100%;height:100%;object-fit:cover;opacity:0.5;"></video>`;
        }
    }

    function switchControlTab(tab) {
        ['text', 'image', 'video'].forEach(t => {
            document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
            document.getElementById(`tab-content-${t}`).classList.toggle('hidden', t !== tab);
        });
    }

    function copyOverlayLink() {
        const url = window.location.origin + window.location.pathname + '?mode=overlay';
        navigator.clipboard.writeText(url);
        showToast('Ссылка скопирована в буфер!');
    }

    function showToast(msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
</script>
